# Генерат графа источников: v3 graph (решения узла Д.ДОК.26–28, Д.ДОК.33). Снимок — vic3_mods_out (папка выше).
version = "1.15"
paths_root = ".."
# генерат — агенту: человеку граф, поиск и списки его не показывают (методика, «Шапка документа», «Кому заметка»)
audience = "agent"
# имена генерата не должны повторять заметки форка и узла (одно хранилище Obsidian)
# справочник движка: дамп script_docs из документов игры (копия — vanilla/движок/дамп/), дата дампа
dump = "C:/Users/Andrey/Documents/Paradox Interactive/Victoria 3/docs"
dump_date = "2026-10-13"
# дамп 13.10 — ещё 1.13 (с E&F): дамп 1.15 без модов не снят (этап ОБН, шаг 2)
dump_version = "1.13"
avoid = ["../../Economic-and-Financial-Ledgerdemain-Mod/docs/понятия", "../../docs"]

